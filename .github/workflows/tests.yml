name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      # A package missing from the constraints (e.g. one only this Python version needs) would install unpinned.
      # This job installs the superset of the e2e job's packages, so checking it here covers both.
      - name: Check installed packages against the constraints
        run: |
          python - <<'EOF'
          import importlib.metadata
          import re
          import sys
          from pathlib import Path


          def canonical(name):
              return re.sub(r'[-_.]+', '-', name).lower()


          lines = (line.split(';')[0].strip() for line in Path('backend/constraints.txt').read_text().splitlines())
          pins = dict(line.split('==') for line in lines if line and not line.startswith('#'))
          pins = {canonical(name): version for name, version in pins.items()}
          unpinned = sorted(f'{dist.name}=={dist.version}' for dist in importlib.metadata.distributions()
                            if canonical(dist.name) != 'pip' and pins.get(canonical(dist.name)) != dist.version)
          if unpinned:
              sys.exit('Missing from backend/constraints.txt or installed at another version: ' + ', '.join(unpinned))
          print(f'All installed packages match backend/constraints.txt ({len(pins)} pins)')
          EOF
      - name: Unit tests with fictional credentials
        run: python -m unittest discover -s tests -v
      # Same ruff.toml and pinned version as local development; runs even if the tests failed.
      - name: Lint with Ruff
        if: ${{ !cancelled() }}
        run: ruff check . --output-format=github
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -c backend/constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright builds the frontend and starts its own backend on 127.0.0.1:5173.
      # A step timeout fails the step, so a hang still uploads traces; the job timeout is a backstop.
      - name: End-to-end tests with fictional credentials
        timeout-minutes: 20
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
