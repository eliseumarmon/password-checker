name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    # 3.12 is the minimum the project supports; 3.14 is the version used for local development.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      - name: Unit tests with fictional credentials
        run: python -m unittest discover -s tests -v
      # Same ruff.toml and pinned version as local development; runs even if the tests failed.
      - name: Lint with Ruff
        if: ${{ !cancelled() }}
        run: ruff check . --output-format=github
      # A package missing from the constraints (e.g. one only this Python version needs) would install unpinned.
      # This job installs the superset of the e2e job's packages, so checking it here covers both.
      # Runs even if the tests or Ruff failed, so each problem is reported on its own.
      - name: Check installed packages against the constraints
        if: ${{ !cancelled() }}
        run: |
          python - <<'EOF'
          import importlib.metadata
          import re
          import sys
          from pathlib import Path


          def canonical(name):
              return re.sub(r'[-_.]+', '-', name).lower()


          pins = {}
          for line in Path('backend/constraints.txt').read_text().splitlines():
              requirement = line.split('#')[0].split(';')[0].strip()
              if not requirement:
                  continue
              pin = re.fullmatch(r'([A-Za-z0-9._-]+)==([^\s=]+)', requirement)
              if not pin:
                  sys.exit(f'Unsupported line in backend/constraints.txt, expected name==version: {line}')
              if canonical(pin[1]) in pins:
                  sys.exit(f'{pin[1]} appears twice in backend/constraints.txt; keep one line per package')
              pins[canonical(pin[1])] = pin[2]
          unpinned = sorted(f'{dist.name}=={dist.version}' for dist in importlib.metadata.distributions()
                            if canonical(dist.name) != 'pip' and pins.get(canonical(dist.name)) != dist.version)
          if unpinned:
              sys.exit('Missing from backend/constraints.txt or installed at another version: ' + ', '.join(unpinned))
          print(f'All installed packages match backend/constraints.txt ({len(pins)} pins)')
          EOF
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -c backend/constraints.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright builds the frontend and starts its own backend on 127.0.0.1:5173.
      # A step timeout fails the step, so a hang still uploads traces; the job timeout is a backstop.
      - name: End-to-end tests with fictional credentials
        timeout-minutes: 20
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
