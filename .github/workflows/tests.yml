name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Unit tests with fictional credentials
        run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright builds the frontend and starts its own backend on 127.0.0.1:5173.
      # A step timeout fails the step, so a hang still uploads traces; the job timeout is a backstop.
      - name: End-to-end tests with fictional credentials
        timeout-minutes: 20
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
