name: Dependency audit
# Separate from tests.yml: a newly published advisory or an audit service outage never fails an unrelated
# change. It runs weekly, on demand, and on changes to the dependency files or to the audit itself.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - backend/requirements.txt
      - backend/requirements-dev.txt
      - backend/constraints.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/audit-requirements.txt
      - .github/scripts/dependency_audit.py
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - backend/requirements.txt
      - backend/requirements-dev.txt
      - backend/constraints.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/audit-requirements.txt
      - .github/scripts/dependency_audit.py
      - .github/workflows/dependency-audit.yml
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The tool and its dependencies are pinned; --no-deps plus pip check fails if the list is incomplete.
      - name: Install pip-audit
        run: |
          python -m pip install --no-deps -r .github/audit-requirements.txt
          python -m pip check
          pip-audit --version
      # The audit script, not pip-audit's exit code, decides: pip-audit exits 0 when it analysed nothing.
      - name: Audit the pinned Python dependencies
        run: |
          set +e
          pip-audit -r backend/constraints.txt --no-deps --disable-pip --format json --output pip-audit.json \
            --progress-spinner off
          status=$?
          set -e
          python .github/scripts/dependency_audit.py python --report pip-audit.json \
            --constraints backend/constraints.txt \
            --requirements backend/requirements.txt backend/requirements-dev.txt --exit-code "$status"
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # npm audit only needs package-lock.json; the production run tells production advisories from development ones.
      - name: Audit the locked frontend dependencies
        working-directory: frontend
        run: |
          npm --version
          set +e
          npm audit --json > ../npm-audit-full.json
          full=$?
          npm audit --omit=dev --json > ../npm-audit-production.json
          production=$?
          set -e
          python ../.github/scripts/dependency_audit.py npm --full ../npm-audit-full.json \
            --production ../npm-audit-production.json --lockfile package-lock.json \
            --exit-full "$full" --exit-production "$production"
      # Signatures need installed packages; install scripts are not run in an audit job.
      - name: Verify registry signatures
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
